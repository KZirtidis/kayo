<body>
<div id="app-shell">
  <div class="ps-topbar">
    <div class="ps-brand">
      <div class="ps-bmark">🌾</div>
      <div>
        <div class="ps-bname">PERO FAMILY FARMS</div>
        <div class="ps-bsub">Planting Schedule</div>
      </div>
    </div>
    <div class="ps-actions">
      <a href="../../index.html" style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;border:1px solid rgba(255,255,255,0.20);background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.75);font-size:12px;font-weight:600;text-decoration:none;letter-spacing:0.03em;transition:all 0.15s" onmouseover="this.style.color='#f5c518';this.style.borderColor='rgba(245,197,24,0.50)'" onmouseout="this.style.color='rgba(255,255,255,0.75)';this.style.borderColor='rgba(255,255,255,0.20)'">&#8592; Pero Central</a>
      <button class="ps-btn" onclick="psResetSchedule()" title="Reset all acres to zero">↺ Reset Acres</button>
      <button class="ps-btn" onclick="psClearAllAcres()" title="Clear all acres">✕ Clear</button>
      <button class="ps-btn primary" onclick="psSave();showToast('Schedule saved','success')">💾 Save</button>
    </div>
  </div>
  <div id="content-area"></div>
</div>
<div id="toast-container"></div>
<div id="modal-container"></div>

<script>
// ── STANDALONE BOOTSTRAP ────────────────────────────────────────────────────
var currentView = 'planting-schedule';
var selectedGrowerId = null;

// Growers — loaded from localStorage (shared with FieldTrack if on same origin)
var growers = [];
function loadStandaloneData(){
  try{ var g=localStorage.getItem('ft_growers'); if(g) growers=JSON.parse(g); }catch(e){ growers=[]; }
  // also load demandEntries for the DEMAND row in PS
  try{ var d=localStorage.getItem('ft_demandEntries'); if(d) demandEntries=JSON.parse(d); }catch(e){}
}
var demandEntries = [];

function renderContent(){
  var el = document.getElementById('content-area');
  try{ el.innerHTML = renderPlantingSchedule(); }
  catch(err){ el.innerHTML='<div style="padding:24px;color:#8B2020"><strong>Error: </strong>'+err.message+'<pre style="font-size:11px;margin-top:8px">'+err.stack+'</pre></div>'; console.error(err); }
}

function navigate(view, gid){
  // In standalone mode, clicking "Back to growers" does nothing useful
  // Just re-render the planting schedule
  currentView = 'planting-schedule';
  renderContent();
}

// ── UTILITY FUNCTIONS ────────────────────────────────────────────────────────
function uid(){return '_'+Math.random().toString(36).slice(2,10)+Date.now();}
function esc(s){if(s==null)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getMondayOf(dateStr){
  // Returns the Monday of the week containing dateStr
  const d = new Date(dateStr);
  const day = d.getDay(); // 0=Sun, 1=Mon ... 6=Sat
  const diff = (day===0) ? -6 : 1 - day; // shift to Monday
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0,10);
}

function showToast(msg,type='success'){
  const icons={success:'✓',info:'i',error:'!'};
  document.getElementById('toast-container').innerHTML=
    `<div class="toast ${type}"><div class="toast-icon">${icons[type]||'✓'}</div>${esc(msg)}</div>`;
  setTimeout(()=>{document.getElementById('toast-container').innerHTML='';},3200);
}

// ── SEASON HELPERS ────────────────────────────────────────────────────
function psFirstMondayOfSeptember(year){
  // Find first Monday of September in given year
  var d = new Date(year+'-09-01T12:00:00');
  while(d.getDay()!==1) d.setDate(d.getDate()+1);
  return d.toISOString().slice(0,10);
}
function psGenerateSeasonDates(startMonday, nWeeks){
  // Returns array of Sunday harvest dates (Monday + 6 days) for nWeeks weeks
  var dates=[];
  var d=new Date(startMonday+'T12:00:00');
  for(var i=0;i<nWeeks;i++){
    var sun=new Date(d); sun.setDate(sun.getDate()+6);
    dates.push(sun.toISOString().slice(0,10));
    d.setDate(d.getDate()+7);
  }
  return dates;
}
const PS_BUILT_IN_SEASONS={
  '2025-2026': psGenerateSeasonDates(psFirstMondayOfSeptember(2025), 31),
  '2026-2027': psGenerateSeasonDates(psFirstMondayOfSeptember(2026), 31)
};
function psGetSeasons(){
  try{ var s=localStorage.getItem('ft_psSeasons'); return s?JSON.parse(s):Object.assign({},PS_BUILT_IN_SEASONS); }
  catch(e){ return Object.assign({},PS_BUILT_IN_SEASONS); }
}
function psSaveSeasons(seasons){
  localStorage.setItem('ft_psSeasons',JSON.stringify(seasons));
}
function psLoadSeason(seasonKey){
  var seasons=psGetSeasons();
  var dates=seasons[seasonKey];
  if(!dates||!dates.length) return;
  // Load dates and reset per-week arrays
  psDates=dates.slice();
  psDaysToHarvest=new Array(dates.length).fill(55);
  psConvYields=new Array(dates.length).fill(150);
  psOrgYields=new Array(dates.length).fill(180);
  // Reset farm acres arrays to match new length
  function resizeAcres(farms){
    farms.forEach(function(f){
      while(f.acres.length<dates.length) f.acres.push(0);
      f.acres=f.acres.slice(0,dates.length);
    });
  }
  if(psConvFarms) resizeAcres(psConvFarms);
  if(psOrgFarms)  resizeAcres(psOrgFarms);
  psSave();
}
function psCreateSeason(){
  var name=prompt('Enter season name (e.g. 2027-2028):');
  if(!name||!name.trim()) return;
  name=name.trim();
  var startYearMatch=name.match(/^(\d{4})/);
  var startYear=startYearMatch?parseInt(startYearMatch[1]):new Date().getFullYear();
  var startMon=psFirstMondayOfSeptember(startYear);
  var custom=prompt('Start date (first Monday of Sept '+startYear+' is '+startMon+') — press OK to use it or type a different YYYY-MM-DD date:',startMon);
  if(!custom) return;
  var dates=psGenerateSeasonDates(custom.trim(),31);
  var seasons=psGetSeasons();
  seasons[name]=dates;
  psSaveSeasons(seasons);
  psActiveSeason=name;
  // Clear all inputs — fresh season starts blank
  psConvFarms = JSON.parse(JSON.stringify(PS_DEFAULT_CONV)).map(function(f){
    return Object.assign({},f,{acres:new Array(dates.length).fill(0),crop2:0});
  });
  psOrgFarms  = JSON.parse(JSON.stringify(PS_DEFAULT_ORG)).map(function(f){
    return Object.assign({},f,{acres:new Array(dates.length).fill(0),crop2:0});
  });
  psDates           = dates.slice();
  psDaysToHarvest   = new Array(dates.length).fill(55);
  psConvYields      = new Array(dates.length).fill(150);
  psOrgYields       = new Array(dates.length).fill(180);
  psSave();
  showToast('Season '+name+' created — all fields cleared for new season!');
  renderContent();
}
function psSwitchSeason(seasonKey){
  psActiveSeason=seasonKey;
  psConvFarms=null; psOrgFarms=null;
  psDates=null; psDaysToHarvest=null; psConvYields=null; psOrgYields=null;
  psLoad();
  renderContent();
}

function psSeasonKey(k){ return 'ft_ps_'+k.replace(/[^a-z0-9]/gi,'_'); }
function psLoad(){
  var sk = psSeasonKey(psActiveSeason);
  if(!psConvFarms){
    var s=localStorage.getItem(sk+'_conv');
    psConvFarms=s?JSON.parse(s):JSON.parse(JSON.stringify(PS_DEFAULT_CONV));
    // migrate legacy single-season data
    if(!s){var leg=localStorage.getItem('ft_psConv');if(leg)psConvFarms=JSON.parse(leg);}
  }
  if(!psOrgFarms){
    var s2=localStorage.getItem(sk+'_org');
    psOrgFarms=s2?JSON.parse(s2):JSON.parse(JSON.stringify(PS_DEFAULT_ORG));
    if(!s2){var leg2=localStorage.getItem('ft_psOrg');if(leg2)psOrgFarms=JSON.parse(leg2);}
  }
  if(!psDates){
    var sd=localStorage.getItem(sk+'_dates');
    if(sd){psDates=JSON.parse(sd);}
    else{var seasons=psGetSeasons();psDates=(seasons[psActiveSeason]||PS_HARVEST_DATES).slice();}
  }
  if(!psDaysToHarvest){var sdth=localStorage.getItem(sk+'_dth');psDaysToHarvest=sdth?JSON.parse(sdth):new Array(psDates.length).fill(55);}
  if(!psConvYields){var sc=localStorage.getItem(sk+'_cy');psConvYields=sc?JSON.parse(sc):new Array(psDates.length).fill(150);}
  if(!psOrgYields){var so=localStorage.getItem(sk+'_oy');psOrgYields=so?JSON.parse(so):new Array(psDates.length).fill(180);}
  while(psDaysToHarvest.length<psDates.length)psDaysToHarvest.push(55);
  while(psConvYields.length<psDates.length)psConvYields.push(150);
  while(psOrgYields.length<psDates.length)psOrgYields.push(180);
}
function psSave(){
  var sk=psSeasonKey(psActiveSeason);
  localStorage.setItem(sk+'_conv',JSON.stringify(psConvFarms));
  localStorage.setItem(sk+'_org',JSON.stringify(psOrgFarms));
  localStorage.setItem(sk+'_dates',JSON.stringify(psDates));
  localStorage.setItem(sk+'_dth',JSON.stringify(psDaysToHarvest));
  localStorage.setItem(sk+'_cy',JSON.stringify(psConvYields));
  localStorage.setItem(sk+'_oy',JSON.stringify(psOrgYields));
}
function psFmt(d){if(!d)return '';var dt=new Date(d+'T12:00:00');return (dt.getMonth()+1)+'/'+(dt.getDate())+'/'+String(dt.getFullYear()).slice(2);}

  // Helper: render a single farm row

      : '<span style="font-size:10.5px;color:#8a9ab8">'+esc(farm.code||'')+'</span>';

      : '<span style="font-size:11.5px;font-weight:600;color:'+col+'">'+(farm.avail>0?farm.avail.toLocaleString():'—')+'</span>';
    // 2nd Crop = avail x 2 (auto-calculated, read-only)

    var balance = avail - farmTotal;

    // Contract section
  var contractRows = contractFarms.map(function(x){ return renderFarmRow(x.f, x.i, true); }).join('');
  var growerOptions='<option value="">— Select Grower —</option>'

    // ── Read-only rows sourced from grower planting records ──────────
  // Filter plantings matching active season, commodity, build display rows
  var plantingRecordRows = '';

      if(p.season !== psActiveSeason) return;

      else if(p.datePlanting&&p.daysToHarvest){var pd=new Date(p.datePlanting+'T12:00:00');pd.setDate(pd.getDate()+parseInt(p.daysToHarvest));harvestDate=pd.toISOString().slice(0,10);}

      // Find week index in psDates
      var wi = psDates.indexOf(harvestDate);

  function summaryRow(label, vals, vColor, bgColor, fmt, isTot){

    +'<th style="padding:7px 5px;font-size:9.5px;border-bottom:2px solid '+col+'40">Code</th>'
    +'<th style="padding:7px 5px;font-size:9.5px;text-align:right;border-bottom:2px solid '+col+'40">Avail</th>'
    +'<th style="padding:7px 5px;font-size:9.5px;text-align:right;border-bottom:2px solid '+col+'40;color:#1a4a28">2nd Crop<div style="font-weight:400;color:#8a9ab8;font-size:8.5px">Avail × 2</div></th>'
    +'<th style="padding:7px 5px;font-size:9.5px;text-align:right;border-bottom:2px solid '+col+'40;color:#1a7a40">Balance</th>'
    +'<th style="padding:7px 5px;font-size:9.5px;text-align:right;border-bottom:2px solid '+col+'40;color:#1a4a28">Bal. 2nd</th>'
    +'<th style="padding:7px 6px;font-size:9.5px;text-align:right;border-bottom:2px solid '+col+'40;border-left:2px solid '+col+'20;border-right:2px solid '+col+'20;background:#f8fafc">Total Ac</th>'
    +wkHdr
    +'<th style="position:sticky;right:0;background:#f8fafc;border-bottom:2px solid '+col+'40;min-width:30px"></th>'
    +'</tr></thead><tbody>'+farmRows+'</tbody><tfoot>'+tfoot+'</tfoot></table></div></div>';
}

function psUpdateDate(wi,val){
  if(!val) return;
  // Snap to Monday
  var dt=new Date(val+'T12:00:00');
  var day=dt.getDay(); // 0=Sun,1=Mon...
  var diff=day===1?0:day===0?1:(8-day);
  if(diff>0) dt.setDate(dt.getDate()+diff);
  // Also try going back to Monday
  var dt2=new Date(val+'T12:00:00');
  var d2=dt2.getDay();
  var back=d2===1?0:d2===0?-6:1-d2;
  dt2.setDate(dt2.getDate()+back);
  var mon=dt2.toISOString().slice(0,10);
  psDates[wi]=mon;
  psSave();
  clearTimeout(window._psT);window._psT=setTimeout(function(){renderContent();},700);
}

function psUpdateFarmField(type,fi,field,val){
  var farms=type==='conventional'?psConvFarms:psOrgFarms;
  if(farms[fi]) farms[fi][field]=val;
  psSave();
  // Don't re-render on every keystroke — just save
}
function psAddBlankRow(section,bi,wi,val,el,col,lc){
  var v=parseFloat(val)||0;
  el.style.background=v>0?lc:'#fafbfe';
  // Stored temporarily in DOM; psSaveBlankRow commits it
}
function psBlankAcreChange(el){
  var v=parseFloat(el.value)||0;
  el.style.background=v>0?'#e8f2fd':'#fafbfe';
}
function psSaveBlankRowBtn(btn){
  var bi=parseInt(btn.dataset.bi);
  var type=btn.dataset.tab;
  psSaveBlankRow('pero',bi,type);
}
function psAssignContractGrowerBtn(sel){
  var bi=parseInt(sel.dataset.bi);
  var type=sel.dataset.tab;
  psAssignContractGrower(type,bi,sel.value);
}
function psSaveBlankRow(section,bi,type){
  var nameEl=document.getElementById('ps-'+section+'-blank-name-'+bi);
  var codeEl=document.getElementById('ps-'+section+'-blank-code-'+bi);
  var availEl=document.getElementById('ps-'+section+'-blank-avail-'+bi);
  var name=(nameEl&&nameEl.value.trim())||'';
  if(!name){showToast('Enter a farm name first','error');return;}
  var code=(codeEl&&codeEl.value.trim())||'';
  var avail=parseFloat(availEl&&availEl.value)||0;
  // Collect acre inputs from the row
  var acres=[];
  var row=nameEl&&nameEl.closest('tr');
  if(row){
    var inputs=row.querySelectorAll('input[type="number"]');
    inputs.forEach(function(inp,i){if(i>0||availEl!==inp) acres.push(parseFloat(inp.value)||0);});
    // Fix: just make empty array the right length
  }
  while(acres.length<psDates.length) acres.push(0);
  var farms=type==='conventional'?psConvFarms:psOrgFarms;
  farms.push({name:name,code:code,avail:avail,acres:acres.slice(0,psDates.length),section:section==='contract'?'contract':'pero'});
  psSave();renderContent();
}
function psAssignContractGrower(type,bi,growerId){
  if(!growerId) return;
  var g=growers.find(function(gr){return gr.id===growerId;});
  if(!g) return;
  var farms=type==='conventional'?psConvFarms:psOrgFarms;
  farms.push({name:g.name,code:g.phone||'',avail:0,acres:new Array(psDates.length).fill(0),section:'contract',growerId:growerId});
  psSave();renderContent();
}
function psAssignBlankFarm(type,blankIdx,growerId){
  if(!growerId) return;
  var g=growers.find(function(gr){return gr.id===growerId;});
  if(!g) return;
  var farms=type==='conventional'?psConvFarms:psOrgFarms;
  // Add as a proper farm row
  var N=psDates.length;
  farms.push({name:g.name, code:g.phone||'', avail:0, acres:new Array(N).fill(0), growerId:growerId});
  psSave();renderContent();
}
function psUpdateBlankAcre(type,bi,wi,val,el,col,lc){
  // Blank rows track into a temporary buffer; once grower is assigned they become real rows
  // For now just highlight the cell
  var v=parseFloat(val)||0;
  el.style.background=v>0?lc:'#fafbfe';
}
function psUpdateDTH(wi,val){
  var v=parseInt(val)||55;
  psDaysToHarvest[wi]=v;
  psSave();
  clearTimeout(window._psT);window._psT=setTimeout(function(){renderContent();},700);
}
function psUpdateWeekYield(wi,val){
  var v=parseFloat(val)||0;
  var yields=psActiveTab==='conventional'?psConvYields:psOrgYields;
  yields[wi]=v;
  psSave();
  clearTimeout(window._psT);window._psT=setTimeout(function(){renderContent();},700);
}

function psSetAllYields(){
  var cur=psActiveTab==='conventional'?psConvYields[0]:psOrgYields[0];
  var val=prompt('Set yield (cartons/ac) for ALL weeks on '+psActiveTab+' schedule:',cur||150);
  if(!val||!val.trim()) return;
  var v=parseFloat(val)||150;
  var yields=psActiveTab==='conventional'?psConvYields:psOrgYields;
  for(var i=0;i<psDates.length;i++) yields[i]=v;
  psSave();renderContent();
}

function psAddWeek(){
  var lastDate=psDates[psDates.length-1];
  var dt=new Date(lastDate+'T12:00:00');
  dt.setDate(dt.getDate()+7);
  var newDate=dt.toISOString().slice(0,10);
  psDates.push(newDate);
  psDaysToHarvest.push(55);
  psConvYields.push(150);
  psOrgYields.push(180);
  psConvFarms.forEach(function(f){f.acres.push(0);});
  psOrgFarms.forEach(function(f){f.acres.push(0);});
  psSave();renderContent();
}

function psUpdateAcre(type,fi,wi,val,el,col,lc){
  var farms=type==='conventional'?psConvFarms:psOrgFarms;
  var v=parseFloat(val)||0;
  farms[fi].acres[wi]=v;
  el.style.background=v>0?lc:'#fff';
  psSave();
  clearTimeout(window._psT);
  window._psT=setTimeout(function(){renderContent();},700);
}
// psSaveYield replaced by psUpdateWeekYield
function psAddFarm(){
  var name=prompt('Farm name:');if(!name||!name.trim())return;
  var code=prompt('Farm code (optional):')||'';
  var avail=parseFloat(prompt('Available acres (optional):')||'0')||0;
  var farms=psActiveTab==='conventional'?psConvFarms:psOrgFarms;
  farms.push({name:name.trim(),code:code.trim(),avail:avail,acres:new Array(psDates.length).fill(0)});
  psSave();renderContent();
}
function psRemoveFarm(type,idx){
  if(!confirm('Remove this farm from the schedule?'))return;
  var farms=type==='conventional'?psConvFarms:psOrgFarms;
  farms.splice(idx,1);psSave();renderContent();
}
function psClearAllAcres(){
  var tab = psActiveTab==='conventional'?'Conventional':'Organic';
  if(!confirm('Clear ALL acres for '+tab+' Green Beans ('+psActiveSeason+')? This will zero every acre input for every farm in this season. This cannot be undone.')) return;
  var farms = psActiveTab==='conventional' ? psConvFarms : psOrgFarms;
  farms.forEach(function(f){
    f.acres = new Array(psDates.length).fill(0);
  });
  psSave();
  showToast('All '+tab+' acres cleared for '+psActiveSeason,'info');
  renderContent();
}

function psResetSchedule(){
  if(!confirm('Reset to original spreadsheet data? This will overwrite all changes for '+(psActiveTab==='conventional'?'Conventional':'Organic')+', including dates and yields.'))return;
  if(psActiveTab==='conventional'){
    psConvFarms=JSON.parse(JSON.stringify(PS_DEFAULT_CONV));
    psConvYields=new Array(PS_HARVEST_DATES.length).fill(150);
  } else {
    psOrgFarms=JSON.parse(JSON.stringify(PS_DEFAULT_ORG));
    psOrgYields=new Array(PS_HARVEST_DATES.length).fill(180);
  }
  psDates=PS_HARVEST_DATES.slice();
  psDaysToHarvest=new Array(PS_HARVEST_DATES.length).fill(55);
  psSave();renderContent();
}
